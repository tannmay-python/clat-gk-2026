<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" overflow="visible">
  <defs>
    <!-- Soft warm orange gradient for petal shading -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d35400" stop-opacity="0.12"/>
    </linearGradient>
    
    <!-- Full Stargazer / Tiger Lily Bloom (radius ~55px when scaled 0.6) -->
    <g id="lily-flower">
      <!-- 6 Recurved Graceful Petals -->
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" transform="rotate(60)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" transform="rotate(120)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" transform="rotate(180)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" transform="rotate(240)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-10 -22 -18 -48 0 -72 C18 -48 10 -22 0 0 Z" transform="rotate(300)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>

      <!-- Midrib lines along each petal -->
      <g stroke="#d35400" stroke-width="0.9" opacity="0.7">
        <path d="M0 -8 C0 -30 0 -52 0 -66"/>
        <path d="M0 -8 C0 -30 0 -52 0 -66" transform="rotate(60)"/>
        <path d="M0 -8 C0 -30 0 -52 0 -66" transform="rotate(120)"/>
        <path d="M0 -8 C0 -30 0 -52 0 -66" transform="rotate(180)"/>
        <path d="M0 -8 C0 -30 0 -52 0 -66" transform="rotate(240)"/>
        <path d="M0 -8 C0 -30 0 -52 0 -66" transform="rotate(300)"/>
      </g>

      <!-- Signature Long Sweeping Stamens & T-Anthers -->
      <g stroke="#e67e22" stroke-width="1.1" fill="#d35400">
        <path d="M0 0 C-6 -15 -14 -34 -17 -42"/>
        <ellipse cx="-17" cy="-42" rx="3.5" ry="1.8" transform="rotate(25 -17 -42)"/>

        <path d="M0 0 C-2 -16 -4 -36 -5 -44"/>
        <ellipse cx="-5" cy="-44" rx="3.5" ry="1.8" transform="rotate(5 -5 -44)"/>

        <path d="M0 0 C8 -15 15 -34 18 -41"/>
        <ellipse cx="18" cy="-41" rx="3.5" ry="1.8" transform="rotate(-30 18 -41)"/>

        <path d="M0 0 C12 -12 21 -29 25 -36"/>
        <ellipse cx="25" cy="-36" rx="3.5" ry="1.8" transform="rotate(-50 25 -36)"/>

        <path d="M0 0 C-12 -12 -21 -29 -24 -35"/>
        <ellipse cx="-24" cy="-35" rx="3.5" ry="1.8" transform="rotate(45 -24 -35)"/>

        <!-- Central Pistil -->
        <path d="M0 0 C0 -18 0 -38 0 -48" stroke="#d35400" stroke-width="1.3"/>
        <circle cx="0" cy="-48" r="2.8" fill="#e67e22"/>
      </g>
    </g>

    <!-- Side-view Lily Bud -->
    <g id="lily-bud">
      <path d="M0 0 C-8 -15 -9 -30 0 -45 C9 -30 8 -15 0 0 Z" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.2"/>
      <path d="M0 0 C-3 -15 -3 -30 0 -45" stroke="#d35400" stroke-width="0.9" opacity="0.6"/>
      <path d="M0 0 C0 10 6 20 12 26" stroke="#e67e22" stroke-width="1.1" fill="none"/>
    </g>

    <!-- Curved Leaf -->
    <g id="lily-leaf">
      <path d="M0 0 C12 -12 28 -15 44 -14 C28 2 12 6 0 0 Z" fill="#e67e22" fill-opacity="0.14" stroke="#e67e22" stroke-width="1.1"/>
    </g>
  </defs>

  <!-- Perfectly Inset Tile Composition (No clipping at 0,0 or 360,360) -->
  <g fill="none">
    <!-- Main Flower Top-Left (Center x=110, y=110) -->
    <g transform="translate(110 110)">
      <use href="#lily-flower" transform="scale(0.85)"/>
    </g>
    
    <!-- Secondary Flower Bottom-Right (Center x=250, y=250) -->
    <g transform="translate(250 250)">
      <use href="#lily-flower" transform="scale(0.75) rotate(42)"/>
    </g>

    <!-- Accent Flower Top-Right (Center x=270, y=80) -->
    <g transform="translate(270 80)">
      <use href="#lily-flower" transform="scale(0.45) rotate(-25)"/>
    </g>

    <!-- Accent Flower Bottom-Left (Center x=80, y=270) -->
    <g transform="translate(80 270)">
      <use href="#lily-flower" transform="scale(0.48) rotate(15)"/>
    </g>

    <!-- Lily Buds & Stems -->
    <g transform="translate(190 150) rotate(-15)">
      <use href="#lily-bud"/>
    </g>
    <g transform="translate(50 190) rotate(35) scale(0.8)">
      <use href="#lily-bud"/>
    </g>

    <!-- Leaves -->
    <g transform="translate(120 180) rotate(-20)">
      <use href="#lily-leaf"/>
    </g>
    <g transform="translate(210 70) rotate(65) scale(0.9)">
      <use href="#lily-leaf"/>
    </g>
    <g transform="translate(170 270) rotate(-75) scale(1.0)">
      <use href="#lily-leaf"/>
    </g>
  </g>
</svg>
