<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <!-- Soft warm orange gradient for petal shading -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d35400" stop-opacity="0.10"/>
    </linearGradient>
    
    <!-- Full Stargazer / Tiger Lily Bloom -->
    <g id="lily-flower">
      <!-- 6 Recurved Graceful Petals -->
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" transform="rotate(60)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" transform="rotate(120)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" transform="rotate(180)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" transform="rotate(240)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M0 0 C-12 -30 -22 -65 0 -95 C22 -65 12 -30 0 0 Z" transform="rotate(300)" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.3" stroke-linecap="round"/>

      <!-- Midrib lines along each petal -->
      <g stroke="#d35400" stroke-width="0.9" opacity="0.7">
        <path d="M0 -10 C0 -40 0 -70 0 -88"/>
        <path d="M0 -10 C0 -40 0 -70 0 -88" transform="rotate(60)"/>
        <path d="M0 -10 C0 -40 0 -70 0 -88" transform="rotate(120)"/>
        <path d="M0 -10 C0 -40 0 -70 0 -88" transform="rotate(180)"/>
        <path d="M0 -10 C0 -40 0 -70 0 -88" transform="rotate(240)"/>
        <path d="M0 -10 C0 -40 0 -70 0 -88" transform="rotate(300)"/>
      </g>

      <!-- Signature Long Sweeping Stamens & T-Anthers -->
      <g stroke="#e67e22" stroke-width="1.1" fill="#d35400">
        <!-- Stamen 1 -->
        <path d="M0 0 C-8 -20 -18 -45 -22 -55"/>
        <ellipse cx="-22" cy="-55" rx="4" ry="2.2" transform="rotate(25 -22 -55)"/>
        <!-- Stamen 2 -->
        <path d="M0 0 C-2 -22 -5 -48 -6 -58"/>
        <ellipse cx="-6" cy="-58" rx="4" ry="2.2" transform="rotate(5 -6 -58)"/>
        <!-- Stamen 3 -->
        <path d="M0 0 C10 -20 20 -45 24 -54"/>
        <ellipse cx="24" cy="-54" rx="4" ry="2.2" transform="rotate(-30 24 -54)"/>
        <!-- Stamen 4 -->
        <path d="M0 0 C15 -15 28 -38 34 -48"/>
        <ellipse cx="34" cy="-48" rx="4" ry="2.2" transform="rotate(-50 34 -48)"/>
        <!-- Stamen 5 -->
        <path d="M0 0 C-15 -15 -28 -38 -32 -46"/>
        <ellipse cx="-32" cy="-46" rx="4" ry="2.2" transform="rotate(45 -32 -46)"/>
        <!-- Central Pistil with 3-lobed stigma -->
        <path d="M0 0 C0 -25 0 -52 0 -64" stroke="#d35400" stroke-width="1.4"/>
        <circle cx="0" cy="-64" r="3.2" fill="#e67e22"/>
      </g>
    </g>

    <!-- Side-view Lily Bud -->
    <g id="lily-bud">
      <path d="M0 0 C-10 -20 -12 -40 0 -60 C12 -40 10 -20 0 0 Z" fill="url(#petalGrad)" stroke="#e67e22" stroke-width="1.2"/>
      <path d="M0 0 C-4 -20 -4 -40 0 -60" stroke="#d35400" stroke-width="0.9" opacity="0.6"/>
      <path d="M0 0 C0 15 8 28 16 36" stroke="#e67e22" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Curved Leaf Vine -->
    <g id="lily-leaf">
      <path d="M0 0 C15 -15 35 -20 55 -18 C35 2 15 8 0 0 Z" fill="#e67e22" fill-opacity="0.12" stroke="#e67e22" stroke-width="1.1"/>
    </g>
  </defs>

  <!-- Tile Composition -->
  <g fill="none">
    <!-- Main Large Flower Center Left -->
    <use href="#lily-flower" x="90" y="100" transform="scale(0.85)"/>
    
    <!-- Secondary Large Flower Bottom Right -->
    <use href="#lily-flower" x="310" y="300" transform="scale(0.75) rotate(42)"/>

    <!-- Small Accent Flower Top Right -->
    <use href="#lily-flower" x="290" y="70" transform="scale(0.48) rotate(-25)"/>

    <!-- Small Accent Flower Bottom Left -->
    <use href="#lily-flower" x="70" y="310" transform="scale(0.52) rotate(15)"/>

    <!-- Lily Buds & Stems -->
    <use href="#lily-bud" x="200" y="190" transform="rotate(-15)"/>
    <use href="#lily-bud" x="40" y="180" transform="rotate(35) scale(0.8)"/>

    <!-- Leaves -->
    <use href="#lily-leaf" x="110" y="170" transform="rotate(-20)"/>
    <use href="#lily-leaf" x="230" y="80" transform="rotate(65) scale(0.9)"/>
    <use href="#lily-leaf" x="180" y="270" transform="rotate(-75) scale(1.1)"/>
  </g>
</svg>
